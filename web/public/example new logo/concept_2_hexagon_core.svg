<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B76BFF" />
      <stop offset="50%" stop-color="#662D91" />
      <stop offset="100%" stop-color="#451B63" />
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="64" fill="#0D0A14" />
  
  <!-- Outer Hexagon -->
  <polygon points="256,60 420,155 420,345 256,440 92,345 92,155" 
           fill="none" stroke="#8B3FD0" stroke-width="5" opacity="0.5" />
           
  <!-- Inner Hexagon Filled -->
  <polygon points="256,95 385,170 385,325 256,400 127,325 127,170" 
           fill="url(#hexGrad)" stroke="#B76BFF" stroke-width="4" />
           
  <!-- Circuit Nodes -->
  <line x1="256" y1="95" x2="256" y2="150" stroke="#FFFFFF" stroke-width="3" />
  <line x1="127" y1="325" x2="180" y2="295" stroke="#FFFFFF" stroke-width="3" />
  <line x1="385" y1="325" x2="332" y2="295" stroke="#FFFFFF" stroke-width="3" />
  
  <!-- Big Central Bold Typography -->
  <text x="256" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="4">aGsx</text>
  <text x="256" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" 
        fill="#FFFFFF" opacity="0.9" text-anchor="middle" letter-spacing="6">PENTEST</text>
</svg>