<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B3FD0" />
      <stop offset="60%" stop-color="#662D91" />
      <stop offset="100%" stop-color="#451B63" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B76BFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#662D91" stop-opacity="0.2" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Base -->
  <rect width="512" height="512" rx="64" fill="#0D0A14" />
  
  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="150" fill="#662D91" opacity="0.25" filter="url(#purpleGlow)" />
  
  <!-- Shield Outline -->
  <path d="M 256 70 L 400 130 C 400 280 340 380 256 430 C 172 380 112 280 112 130 Z" 
        fill="url(#shieldGrad)" stroke="#B76BFF" stroke-width="6" />
  
  <!-- Inner Shield Accent -->
  <path d="M 256 105 L 372 155 C 372 275 322 355 256 395 C 190 355 140 275 140 155 Z" 
        fill="#0D0A14" opacity="0.6" stroke="#8B3FD0" stroke-width="3" stroke-dasharray="12 6" />

  <!-- Stylized aGsx Monogram -->
  <text x="256" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="2">aGsx</text>
  
  <!-- Subtitle -->
  <text x="256" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" 
        fill="#B76BFF" text-anchor="middle" letter-spacing="8">SECURITY</text>
  
  <!-- Security Core Node -->
  <circle cx="256" cy="180" r="10" fill="#B76BFF" />
  <circle cx="256" cy="180" r="18" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
</svg>